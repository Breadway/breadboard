# breadboard-server configuration. Every key is optional; defaults shown.
# Secrets can also come from BREADBOARD_* env vars (preferred in deployment).

listen      = "127.0.0.1:7280"
public_url  = "http://127.0.0.1:7280"
# database_path defaults to $XDG_DATA_HOME/breadboard/breadboard.db

[forgejo]
base_url               = "https://git.breadway.dev"
oauth_client_id        = ""    # BREADBOARD_FORGEJO_OAUTH_CLIENT_ID
oauth_client_secret    = ""    # BREADBOARD_FORGEJO_OAUTH_CLIENT_SECRET
webhook_secret         = ""    # BREADBOARD_FORGEJO_WEBHOOK_SECRET
api_token              = ""    # BREADBOARD_FORGEJO_API_TOKEN  (see memory: forgejo-token)
reconcile_interval_mins = 10
repos = []                     # e.g. ["Breadway/bread", "Breadway/breadbar"]

[notifications]
bread_events = true            # emit bread.board.* via bread-emit when present
breadbar     = true            # desktop notifications through breadbar
daily_digest = false

# breadboard-server configuration. Every key is optional; defaults shown.
# Secrets can also come from BREADBOARD_* env vars (preferred in deployment).

listen      = "127.0.0.1:7280"
public_url  = "http://127.0.0.1:7280"
# database_path defaults to $XDG_DATA_HOME/breadboard/breadboard.db
# web_dir: serve the built SPA at /. Unset in dev (Vite serves the UI).
#   BREADBOARD_WEB_DIR overrides. e.g. "apps/web/dist" or an install path.
# web_dir = "/usr/local/share/breadboard/web"

[forgejo]
base_url               = "https://git.breadway.dev"
oauth_client_id        = ""    # BREADBOARD_FORGEJO_OAUTH_CLIENT_ID
oauth_client_secret    = ""    # BREADBOARD_FORGEJO_OAUTH_CLIENT_SECRET
webhook_secret         = ""    # BREADBOARD_FORGEJO_WEBHOOK_SECRET
api_token              = ""    # BREADBOARD_FORGEJO_API_TOKEN  (see memory: forgejo-token)
reconcile_interval_mins = 10
repos = []                     # e.g. ["Breadway/bread", "Breadway/breadbar"]

[notifications]
bread_events = true            # emit bread.board.* via bread-emit when present
breadbar     = true            # desktop notifications through breadbar
daily_digest = false           # run the daily digest job (BREADBOARD_NOTIFICATIONS_DAILY_DIGEST)
digest_hour  = 8               # local hour 0-23 to send it (BREADBOARD_NOTIFICATIONS_DIGEST_HOUR)

[usage]
# Token and cost stats imported from OpenCode's session database. Defaults to
# $XDG_DATA_HOME/opencode/opencode.db. In a container mount the whole OpenCode
# data directory read-only and point this inside it, for example:
#   -v /home/breadway/.local/share/opencode:/var/lib/opencode:ro
#   opencode_db = "/var/lib/opencode/opencode.db"
# A read-only directory mount is safe with WAL; SQLite must read opencode.db,
# opencode.db-wal and opencode.db-shm. Do not mount the single db file, and do
# not use immutable=1. For a copy, use `sqlite3 <path> ".backup <copy>"` (a
# point-in-time snapshot), never cp. Without the mount the importer stays idle;
# an empty BREADBOARD_USAGE_OPENCODE_DB disables it and import returns 400.
# opencode_db          = "/var/lib/opencode/opencode.db"
import_interval_mins = 5       # BREADBOARD_USAGE_IMPORT_INTERVAL_MINS
spend_warn_usd       = 5.0     # BREADBOARD_USAGE_SPEND_WARN_USD; 0 disables warnings
# Billing mode for providers without an entry below: "metered" (default) or
# "allowance". BREADBOARD_USAGE_BILLING_MODE overrides this key.
billing_mode = "metered"

# OpenCode Go is a prepaid plan (Go $10/month, Go Plus $40), not per-token
# billing. Each model has its own monthly dollar allowance; usage draws it down
# at the model's per-1M-token API rates. OpenCode's own reported cost is ignored
# for this provider because it is inconsistent. Windows are slices of the
# monthly allowance: 5 hours 20%, weekly 50%, monthly 100%. In a container
# without a mounted config file the same table can be supplied as
# BREADBOARD_USAGE_PROVIDERS_TOML (the TOML body under [usage.providers]).
[usage.providers.opencode-go]
mode               = "allowance"
plan_price_usd     = 10.0
# DeepSeek off-peak discount: 16:30-00:30 UTC. Buckets outside it pay peak.
off_peak_start_utc = "16:30"
off_peak_end_utc   = "00:30"

# Keys are OpenCode model ids. Add a model here to price it; an unlisted model
# still counts its tokens but is shown as unrated instead of a guessed dollar
# figure. `allowance_usd` is that model's monthly allowance on the plan.
[usage.providers.opencode-go.models."deepseek-v4.1-flash"]
allowance_usd = 100.0
[usage.providers.opencode-go.models."deepseek-v4.1-flash".rates]
input       = 0.30   # USD per 1M input tokens
output      = 1.20   # USD per 1M output tokens (reasoning uses this rate)
cache_read  = 0.006
cache_write = 0.30   # DeepSeek charges cache writes at the input rate
[usage.providers.opencode-go.models."deepseek-v4.1-flash".rates.off_peak]
input       = 0.15
output      = 0.60
cache_read  = 0.003
cache_write = 0.15

[usage.providers.opencode-go.models."muse-spark-1.3-contributor"]
allowance_usd = 60.0
[usage.providers.opencode-go.models."muse-spark-1.3-contributor".rates]
input       = 0.10
output      = 0.20
cache_read  = 0.002
cache_write = 0.10

# Most other models carry a $60 monthly allowance and flagships $15. Add each
# one with its rates; there is no wildcard pricing because rates are real money.

[claims]
# Live exclusive claim budgets. Intents are never capped, and releasing a
# claim frees capacity immediately. Tune here; no migration is needed.
max_exclusive_per_agent        = 10   # BREADBOARD_CLAIMS_MAX_EXCLUSIVE_PER_AGENT
max_exclusive_per_orchestrator = 100  # BREADBOARD_CLAIMS_MAX_EXCLUSIVE_PER_ORCHESTRATOR

[agents]
# Periodic roster hygiene. Each pass first reaps stale claims, then removes
# rows nobody is using. Runs once at startup and then this many minutes apart.
# 0 disables the periodic passes but keeps the startup pass.
maintenance_interval_mins = 60              # BREADBOARD_AGENTS_MAINTENANCE_INTERVAL_MINS

# A row with an OpenCode session id is removed only when it has no claims, no
# chat membership or DM, no open review request, is not paused, and has not
# heartbeated for this many hours. Subagent history and parent links survive a
# day. 0 disables pruning of session-bound rows.
prune_after_hours = 24                      # BREADBOARD_AGENTS_PRUNE_AFTER_HOURS

# A sessionless row is a one-shot identity. Under the same protections it is
# removed after this many hours, which clears ghosts from MCP clients that
# cannot report a session id. 0 disables removal of sessionless rows.
ephemeral_prune_after_hours = 2             # BREADBOARD_AGENTS_EPHEMERAL_PRUNE_AFTER_HOURS

# Stale claim reaping, run before each prune pass. A claim is released when its
# own heartbeat is this many hours old, its session id is null or is not a live
# session for that agent name, and the agent is not paused by hand. A live
# session keeps only the claims that carry its own session id. Each release
# keeps a handoff row, an agent event and an audit entry naming the previous
# owner. 0 disables reaping.
claim_reap_after_hours = 72                 # BREADBOARD_AGENTS_CLAIM_REAP_AFTER_HOURS

# breadboard as a self-contained container. The Rust build runs in the
# rust:1-bookworm stage of the Containerfile, so the host needs no toolchain.
#
#   docker compose -f packaging/compose.yaml --project-directory . up -d --build
#
# Run it from the repo root (--project-directory .) so the build context and the
# .env file resolve there. Secrets go in .env (NOT committed):
#
#   BREADBOARD_PUBLIC_URL=https://issues.example.com
#   BREADBOARD_FORGEJO_BASE_URL=https://git.example.com
#   BREADBOARD_FORGEJO_OAUTH_CLIENT_ID=...
#   BREADBOARD_FORGEJO_OAUTH_CLIENT_SECRET=...
#   BREADBOARD_FORGEJO_WEBHOOK_SECRET=...
#   BREADBOARD_FORGEJO_API_TOKEN=...
#
# Continuous backup (litestream service below) is on by default and writes a
# file replica. Point it at real storage with BREADBOARD_BACKUP_DIR in .env
# (an absolute host path, e.g. /var/backups/breadboard on Hestia); it defaults
# to ./backups under the repo. For an off-box S3 replica, fill in the s3 block
# in packaging/litestream.yml and set the LITESTREAM_* keys in .env.
#
# See packaging/DEPLOY.md for the full runbook, including the restore procedure.

services:
  breadboard:
    build:
      context: .
      dockerfile: packaging/Containerfile
    image: breadboard:local
    container_name: breadboard
    restart: unless-stopped
    ports:
      - "${BREADBOARD_BIND:-127.0.0.1:7280}:7280"
    environment:
      BREADBOARD_PUBLIC_URL: ${BREADBOARD_PUBLIC_URL:?set BREADBOARD_PUBLIC_URL}
      BREADBOARD_FORGEJO_BASE_URL: ${BREADBOARD_FORGEJO_BASE_URL:-}
      BREADBOARD_FORGEJO_OAUTH_CLIENT_ID: ${BREADBOARD_FORGEJO_OAUTH_CLIENT_ID:-}
      BREADBOARD_FORGEJO_OAUTH_CLIENT_SECRET: ${BREADBOARD_FORGEJO_OAUTH_CLIENT_SECRET:-}
      BREADBOARD_FORGEJO_WEBHOOK_SECRET: ${BREADBOARD_FORGEJO_WEBHOOK_SECRET:-}
      BREADBOARD_FORGEJO_API_TOKEN: ${BREADBOARD_FORGEJO_API_TOKEN:-}
    volumes:
      - breadboard-data:/var/lib/breadboard

  # Continuous backup of the SQLite database via Litestream. It reads the same
  # data volume (so it sees breadboard.db plus the -wal/-shm files) and streams
  # changes to the replica configured in packaging/litestream.yml. The default
  # replica is a file replica under /var/backups/breadboard, bind-mounted from
  # BREADBOARD_BACKUP_DIR on the host. Restore procedure: packaging/DEPLOY.md.
  litestream:
    image: litestream/litestream:0.3.13
    container_name: breadboard-litestream
    restart: unless-stopped
    command: ["replicate"]
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      # Read/write: Litestream keeps its own shadow WAL next to the database
      # and takes a read lock plus periodic checkpoints, so :ro will not work.
      - breadboard-data:/var/lib/breadboard
      - ${BREADBOARD_BACKUP_DIR:-./backups}:/var/backups/breadboard
      - ./packaging/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - breadboard

volumes:
  breadboard-data:

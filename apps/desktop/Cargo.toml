[package]
name = "breadboard-desktop"
version = "0.1.0"
edition = "2021"
description = "Native shell for breadboard"
authors = ["Breadway"]
# Deliberately NOT a workspace member: it needs the Tauri system libs and its
# own toolchain; `cargo build --workspace` and CI skip it.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

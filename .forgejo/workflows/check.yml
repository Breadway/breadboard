name: check

# clippy + tests + doc-drift on work branches and on main (a push to main
# publishes a dev build, so it gets checked first).
on:
  push:
    branches: ['feature/**', 'fix/**', 'main']

jobs:
  check:
    runs-on: [self-hosted, hestia]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch "${GITHUB_REF_NAME}" --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      - name: clippy
        run: cd src && cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cd src && cargo test --workspace --locked

      - name: check-docs
        run: cd src && cargo run -p xtask --locked -- check-docs

  web:
    runs-on: [self-hosted, hestia]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch "${GITHUB_REF_NAME}" --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src
      - name: install
        run: cd src && npm ci
      - name: svelte-check
        run: cd src && npm run check -w breadboard-web
      - name: build
        run: cd src && npm run build

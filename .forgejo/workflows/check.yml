name: check

# Lint, test, doc-drift, and a frontend build on work branches and on main.
on:
  push:
    branches: ['feature/**', 'fix/**', 'main']

jobs:
  check:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch "${GITHUB_REF_NAME}" --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      - name: clippy
        run: cd src && cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cd src && cargo test --workspace --locked

      - name: check-docs
        run: cd src && cargo run -p xtask --locked -- check-docs

      - name: bakery publisher transaction
        run: cd src && bash scripts/test-publish-bakery-stage.sh

      - name: web
        run: |
          set -euo pipefail
          cd src
          npm ci
          npm run build -w @breadboard/api-client
          npm run check -w breadboard-web
          npm run build
